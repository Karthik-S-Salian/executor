# Dependencies only. The worker must run on a Linux host with isolate installed
# (it needs root/cgroups); run the API anywhere.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: executor
      POSTGRES_PASSWORD: executor
      POSTGRES_DB: executor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data"]
    ports:
      - "4222:4222"
    volumes:
      - natsdata:/data

volumes:
  pgdata:
  natsdata:
